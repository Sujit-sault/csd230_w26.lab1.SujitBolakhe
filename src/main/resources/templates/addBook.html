<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Book</title>
</head>
<body>
<h1>Add New Book</h1>
<form action="#" th:action="@{/books/add}" method="post">
    <label>Title: <input type="text" name="title" required /></label><br/><br/>
    <label>Author: <input type="text" name="author" required /></label><br/><br/>
    <label>ISBN: <input type="text" name="isbn" /></label><br/><br/>
    <label>Price: <input type="number" step="0.01" name="price" required /></label><br/><br/>
    <label>Copies: <input type="number" name="copies" required /></label><br/><br/>
    <button type="submit">Add Book</button>
</form>
<br/>
<a th:href="@{/books}">Back to List</a>
</body>
</html>
