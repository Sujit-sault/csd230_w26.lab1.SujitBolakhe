<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Shopping Cart</title>
</head>
<body>

<div style="float:right">
    Logged in as: <span sec:authentication="name">User</span>
    <form th:action="@{/logout}" method="post" style="display:inline;">
        <button type="submit">Sign Out</button>
    </form>
</div>

<h1>Your Shopping Cart</h1>

<div th:if="${#lists.isEmpty(cart.products)}">
    <p>Your cart is empty.</p>
</div>

<table border="1" th:unless="${#lists.isEmpty(cart.products)}">
    <thead>
    <tr>
        <th>Item Name / Description</th>
        <th>Type</th>
        <th>Price</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${cart.products}">
        <td>
            <span th:if="${product instanceof T(csd230.lab1.entities.PublicationEntity)}"
                  th:text="${product.title}"></span>

            <span th:if="${product instanceof T(csd230.lab1.entities.TicketEntity)}"
                  th:text="${product.description}"></span>
        </td>

        <td th:text="${product.productType}"></td>
        <td th:text="${product.price}"></td>

        <td>
            <a th:href="@{/cart/remove/{bookId}(bookId=${product.id})}">Remove</a>
        </td>
    </tr>
    </tbody>
</table>

<br/>

<form th:action="@{/cart/checkout}" method="post"
      th:unless="${#lists.isEmpty(cart.products)}">
    <button type="submit">Checkout</button>
</form>

<p>
    <a th:href="@{/books}">Continue Shopping</a>
</p>

</body>
</html>
